<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازی سنگ، کاغذ، قیچی</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
      background: #f0f0f0;
    }
    h1 {
      color: #333;
    }
    .choices button {
      padding: 15px 25px;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
      border: 2px solid #333;
      background-color: #fff;
      transition: 0.3s;
    }
    .choices button:hover {
      background-color: #ddd;
    }
    #result {
      margin-top: 30px;
      font-size: 22px;
      font-weight: bold;
      color: #222;
    }
  </style>
</head>
<body>

  <h1>بازی سنگ، کاغذ، قیچی</h1>
  <p>یک گزینه انتخاب کن:</p>

  <div class="choices">
    <button onclick="play('سنگ')">سنگ 🪨</button>
    <button onclick="play('کاغذ')">کاغذ 📄</button>
    <button onclick="play('قیچی')">قیچی ✂️</button>
  </div>

  <div id="result"></div>

  <script>
    function play(userChoice) {
      const choices = ['سنگ', 'کاغذ', 'قیچی'];
      const computerChoice = choices[Math.floor(Math.random() * choices.length)];

      let result = '';

      if (userChoice === computerChoice) {
        result = "مساوی شد!";
      } else if (
        (userChoice === 'سنگ' && computerChoice === 'قیچی') ||
        (userChoice === 'کاغذ' && computerChoice === 'سنگ') ||
        (userChoice === 'قیچی' && computerChoice === 'کاغذ')
      ) {
        result = "شما برنده شدید! 🎉";
      } else {
        result = "کامپیوتر برنده شد! 🤖";
      }

      document.getElementById('result').innerHTML = `
        شما: ${userChoice} <br>
        کامپیوتر: ${computerChoice} <br>
        نتیجه: ${result}
      `;
    }
  </script>

</body>
</html>
